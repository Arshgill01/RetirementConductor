api_version: retirement-conductor/v1alpha1
kind: column_retirement
campaign:
  id: ret-fiction-order-status
  name: Replace legacy order status in the generated fiction-retail consumer
target:
  datahub_urn: urn:li:dataset:(urn:li:dataPlatform:sqlite,retirement_benchmark.analytics.fiction_retail.orders,PROD)
  platform: sqlite
  instance: retirement_benchmark
  database: analytics
  schema: fiction_retail
  table: orders
  field: legacy_status
replacement:
  datahub_urn: urn:li:dataset:(urn:li:dataPlatform:sqlite,retirement_benchmark.analytics.fiction_retail.orders,PROD)
  platform: sqlite
  instance: retirement_benchmark
  database: analytics
  schema: fiction_retail
  table: orders
  field: order_status
evidence:
  datahub:
    required: true
    direction: downstream
    max_hops: 3
    platform_filters: []
    maximum_age_seconds: 900
  repositories:
    - id: benchmark
      path: .retirement-conductor/benchmark/workspace/repository
      branch: main
      required: true
  query_history:
    required: false
    requested_window_days: 30
authorization:
  mode: apply
  allowed_repositories:
    - benchmark
  allowed_paths:
    - models/
  allowed_native_objects: []
validation:
  required_receipt_types:
    - dbt
policy:
  id: default-column-retirement
  version: 1
