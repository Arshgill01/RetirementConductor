api_version: retirement-conductor/v1alpha1
kind: column_retirement
campaign:
  id: ret-orders-heterogeneous
  name: Replace legacy order status across dbt and Superset consumers
target:
  datahub_urn: urn:li:dataset:(urn:li:dataPlatform:postgres,ws04 orders postgresql.public.orders,PROD)
  platform: postgres
  instance: ws04-feasibility
  database: ws04 orders postgresql
  schema: public
  table: orders
  field: legacy_status
replacement:
  datahub_urn: urn:li:dataset:(urn:li:dataPlatform:postgres,ws04 orders postgresql.public.orders,PROD)
  platform: postgres
  instance: ws04-feasibility
  database: ws04 orders postgresql
  schema: public
  table: orders
  field: order_status
evidence:
  datahub:
    required: true
    direction: downstream
    max_hops: 3
    platform_filters: []
    maximum_age_seconds: 900
  repositories:
    - id: analytics
      path: .retirement-conductor/heterogeneous/repository
      branch: main
      required: true
  query_history:
    required: false
    requested_window_days: 30
authorization:
  mode: apply
  allowed_repositories:
    - analytics
  allowed_paths:
    - models/
  allowed_native_objects:
    - superset:dataset:1
validation:
  required_receipt_types:
    - dbt
policy:
  id: default-column-retirement
  version: 1
