[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "retirement-conductor"
version = "0.2.0"
description = "Verified change operations for retiring legacy data fields"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Retirement Conductor contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
retirement-conductor = "retirement_conductor.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retirement_conductor"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/repository" = "retirement_conductor/fixture_data/repository"
"fixtures/scenarios" = "retirement_conductor/fixture_data/scenarios"
"fixtures/specs/valid.yaml" = "retirement_conductor/reference_data/spec.yaml"
"schemas" = "retirement_conductor/schemas"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
