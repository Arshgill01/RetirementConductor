# Local checkout of one disposable LookML project. No deploy key or admin API
# credential is required: project and warehouse mapping are explicit.
pipeline_name: retirement-conductor-lookml-${LOOKER_PLATFORM_INSTANCE}

source:
  type: lookml
  config:
    base_folder: ${LOOKML_BASE_FOLDER}
    project_name: ${LOOKER_PROJECT_ID}
    platform_instance: ${LOOKER_PLATFORM_INSTANCE}
    env: PROD

    parse_table_names_from_sql: true
    extract_column_level_lineage: true
    allow_partial_lineage_results: false
    emit_reachable_views_only: true
    use_api_for_view_lineage: false

    # DataHub expands environment references in values, not mapping keys.
    # The disposable LookML project therefore uses this fixed exact connection.
    connection_to_platform_map:
      retirement_fixture:
        platform: ${LOOKER_WAREHOUSE_PLATFORM}
        default_db: ${LOOKER_WAREHOUSE_DATABASE}
        default_schema: ${LOOKER_WAREHOUSE_SCHEMA}
        platform_instance: ${LOOKER_WAREHOUSE_INSTANCE}
        platform_env: PROD

    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
      fail_safe_threshold: 100

sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_GMS_TOKEN}
    # Wait for each write; the entity reread remains the evidence authority.
    mode: SYNC
