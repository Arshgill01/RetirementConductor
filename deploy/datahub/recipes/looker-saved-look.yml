# Disposable saved-Look metadata only. Every ${...} value is supplied at runtime.
# This recipe is scaffolding until a user-provided Looker instance exists.
pipeline_name: retirement-conductor-looker-${LOOKER_PLATFORM_INSTANCE}

source:
  type: looker
  config:
    base_url: ${LOOKER_BASE_URL}
    client_id: ${LOOKER_CLIENT_ID}
    client_secret: ${LOOKER_CLIENT_SECRET}
    platform_instance: ${LOOKER_PLATFORM_INSTANCE}
    include_platform_instance_in_urns: true
    env: PROD

    # A standalone saved Look is otherwise excluded by default.
    extract_independent_looks: true
    extract_column_level_lineage: true
    emit_used_explores_only: true
    include_deleted: false

    # Usage history queries System Activity. It is deliberately disabled for
    # the zero-query boundary and is not accepted as closure evidence.
    extract_usage_history: false
    extract_embed_urls: false
    extract_owners: true

    # The patterns are user-supplied anchored regular expressions for one
    # numeric Look ID and one disposable shared folder path.
    dashboard_pattern:
      allow: []
      deny:
        - ".*"
    chart_pattern:
      allow:
        - ${LOOKER_CONTENT_ID_PATTERN}
      deny: []
      ignoreCase: false
    folder_path_pattern:
      allow:
        - ${LOOKER_FOLDER_PATH_PATTERN}
      deny: []
      ignoreCase: false
    skip_personal_folders: true

    max_threads: 1
    max_retries: 2
    transport_options:
      timeout: 30
      headers: {}

    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
      # The disposable scope contains one object, so its intentional
      # delete/recreate probe is a 100% change.
      fail_safe_threshold: 100

sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_GMS_TOKEN}
    # Wait for each write; the entity reread remains the evidence authority.
    mode: SYNC
